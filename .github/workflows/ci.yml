name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Database tests (migrations, RLS, RPCs)
        run: npm run test:db
      - name: Security audit
        run: npm run audit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_CITY: kirkuk
      - name: Boot check (production server, no database)
        run: |
          npm run start -- -p 3100 &
          for i in $(seq 1 30); do curl -fs localhost:3100/api/health && break || sleep 1; done
          curl -fs localhost:3100/ | grep -q 'dir="rtl"'
          curl -fs -o /dev/null -w "%{http_code}\n" localhost:3100/offline
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
